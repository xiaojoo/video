<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The <=24 px cut of app.svg, rastered into app16.png / app24.png and into the two
       smallest frames of app.ico. Same film-strip language, three simplifications, each one
       because the feature stops surviving the raster:
         - four sprocket holes -> two, and wider: at 16 px four 13-unit holes land on
           1.6 px each and read as a broken edge, not as film;
         - the border goes 0.079W -> 0.105W, so it is still a line and not a grey seam;
         - the navy core is dropped: inside a 16 px mark it merges with the band behind it.
       Everything else (tile, band width, corner radius, mark position, palette) is shared
       with app.svg, so the two cut the same figure at the sizes where both are used. -->
  <defs>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#002E7C"/>
      <stop offset="0.60" stop-color="#002E7C"/>
      <stop offset="0.72" stop-color="#05C6FF"/>
      <stop offset="1" stop-color="#05C6FF"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="0" y="8" width="128" height="112" rx="10"/>
    </clipPath>
  </defs>
  <rect x="0" y="8" width="128" height="112" rx="10" fill="#FFFFFF"/>
  <rect x="6.7" y="14.7" width="114.6" height="98.6" rx="3.3" fill="none" stroke="url(#seam)"
        stroke-width="13.4"/>
  <g clip-path="url(#tile)">
    <path d="M0 8 H36.7 V110 L25.6 120 H0 Z" fill="#002E7C"/>
    <g fill="#FFFFFF">
      <rect x="7.3" y="30.2" width="17.1" height="17.1" rx="4"/>
      <rect x="7.3" y="78.7" width="17.1" height="17.1" rx="4"/>
    </g>
  </g>
  <path d="M45 28.9 L101.3 64 L45 99.1 Z" fill="#05C6FF" stroke="#05C6FF" stroke-width="12"
        stroke-linejoin="round"/>
</svg>
